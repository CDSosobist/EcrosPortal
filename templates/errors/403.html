{% extends "base.html" %}
{% block title %}Доступ запрещён — {{ PORTAL_SITE_NAME }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:40px auto">
  <div class="empty" style="padding:44px 24px">
    <svg class="icon empty__icon" style="width:56px;height:56px;color:var(--warning)"><use href="#i-shield"/></svg>
    <h1 style="font-size:22px;margin-bottom:6px">Доступ запрещён</h1>
    <p class="muted">У вас недостаточно прав для этого раздела. Если доступ нужен по работе —
      обратитесь к руководителю или в отдел кадров.</p>
    <a href="{% url 'portal:dashboard' %}" class="btn btn--primary mt-2">На главную</a>
  </div>
</div>
{% endblock %}
