{% extends "base.html" %}
{% block title %}Страница не найдена — {{ PORTAL_SITE_NAME }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:40px auto">
  <div class="empty" style="padding:44px 24px">
    <svg class="icon empty__icon" style="width:56px;height:56px;color:var(--text-muted)"><use href="#i-search"/></svg>
    <h1 style="font-size:22px;margin-bottom:6px">Страница не найдена</h1>
    <p class="muted">Возможно, ссылка устарела или объект был удалён. Проверьте адрес или воспользуйтесь поиском.</p>
    <a href="{% url 'portal:dashboard' %}" class="btn btn--primary mt-2">На главную</a>
  </div>
</div>
{% endblock %}
