{% if messages %}
<div class="messages">
  {% for message in messages %}
  <div class="alert alert--{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}" data-autohide>
    <svg class="icon"><use href="#i-{% if message.tags == 'error' %}alert{% elif message.tags == 'success' %}check{% elif message.tags == 'warning' %}alert{% else %}info{% endif %}"/></svg>
    <div>{{ message }}</div>
  </div>
  {% endfor %}
</div>
{% endif %}
